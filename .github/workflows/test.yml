name: CI Pipeline

on:
  - push
  - pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Rust test matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, beta]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust ${{ matrix.rust }} with dependency cache
        uses: actions/setup-rust@v1
        with:
          cache: ${{ hashFiles('Cargo.lock') != '' && 'true' || '' }}

      - name: Install dependencies
        if: hashFiles('Cargo.toml') != ''
        shell: bash
        run: cargo fetch --locked

      - name: Lint and format check
        if: hashFiles('Cargo.toml') != ''
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings

      - name: Build and typecheck
        if: hashFiles('Cargo.toml') != ''
        shell: bash
        run: cargo check --all-targets --all-features

      - name: Run unit and integration tests
        if: hashFiles('Cargo.toml') != ''
        shell: bash
        run: cargo test --all-targets --all-features

      - name: Write pipeline summary
        if: always()
        shell: bash
        run: |
          set -eu
          checkout_outcome="${{ steps.checkout.outcome }}"
          rust_outcome="${{ steps.setup-rust.outcome }}"
          deps_outcome="${{ steps.dependencies.outcome }}"
          lint_outcome="${{ steps.lint-format.outcome }}"
          build_outcome="${{ steps.build-typecheck.outcome }}"
          test_outcome="${{ steps.tests.outcome }}"
          {
            printf '## Rust CI summary\n\n'
            printf '| Step | Outcome |\n'
            printf '|---|---|\n'
            printf '| Checkout | %s |\n' "$checkout_outcome"
            printf '| Rust setup | %s |\n' "$rust_outcome"
            printf '| Dependencies | %s |\n' "$deps_outcome"
            printf '| Lint and format | %s |\n' "$lint_outcome"
            printf '| Build and typecheck | %s |\n' "$build_outcome"
            printf '| Unit and integration tests | %s |\n' "$test_outcome"
          } >> "$GITHUB_STEP_SUMMARY"
